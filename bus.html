
<!DOCTYPE html>
<html>
<head>
    <title>Bus Ticket Booking System</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightyellow;
            text-align: center;
        }

        h1 {
            background-color: darkgreen;
            color: white;
            padding: 20px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            max-width: 450px;
            border-radius: 10px;
        }

        input, select {
            padding: 10px;
            margin: 8px;
            width: 80%;
        }

        button {
            background-color: darkgreen;
            color: white;
            padding: 10px 15px;
            border: none;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Online Bus Ticket Booking</h1>

<div class="box">
    <h2>Search Bus</h2>

    <input id="from" placeholder="From"><br>
    <input id="to" placeholder="Destination"><br>
    <input type="date" id="date"><br>

    <select id="busType">
        <option>Volvo</option>
        <option>Sleeper Coach</option>
        <option>AC Bus</option>
    </select><br>

    <button onclick="searchBus()">Search Bus</button>
    <p id="result"></p>
</div>

<div class="box">
    <h2>Register / Login</h2>

    <input id="user" placeholder="Username"><br>
    <input type="password" id="pass" placeholder="Password"><br>

    <button onclick="login()">Login</button>
    <p id="loginResult"></p>
</div>

<div class="box">
    <h2>Book Ticket</h2>

    <input id="name" placeholder="Passenger Name"><br>
    <input type="number" id="seats" placeholder="Number of Seats" min="1"><br>

    <button onclick="bookTicket()">Book Ticket</button>
    <p id="ticket"></p>
</div>

<div class="box">
    <h2>My Ticket</h2>
    <p id="myTicket">No ticket booked.</p>

    <button onclick="cancelTicket()">Cancel Ticket</button>
</div>

<div class="box">
    <h2>Comments</h2>

    <input id="comment" placeholder="Enter your comment"><br>
    <button onclick="addComment()">Submit Comment</button>
    <p id="commentResult"></p>
</div>

<div class="box">
    <h2>Admin Login / Report</h2>

    <input id="admin" placeholder="Username"><br>
    <input type="password" id="adminPass" placeholder="Password"><br>

    <button onclick="adminLogin()">Login</button>
    <p id="report"></p>
</div>

<script>
    let booked = false;

    function searchBus() {
        let from = document.getElementById("from").value;
        let to = document.getElementById("to").value;
        let type = document.getElementById("busType").value;

        if (from == "" || to == "") {
            alert("Enter source and destination");
        } else {
            document.getElementById("result").innerHTML =
                "Bus Type: " + type +
                "<br>Route: " + from + " to " + to +
                "<br>Available Seats: 30";
        }
    }

    function login() {
        let user = document.getElementById("user").value;
        let pass = document.getElementById("pass").value;

        if (user != "" && pass != "") {
            document.getElementById("loginResult").innerHTML =
                "Login Successful!";
        } else {
            document.getElementById("loginResult").innerHTML =
                "Enter username and password.";
        }
    }

    function bookTicket() {
        let name = document.getElementById("name").value;
        let seats = Number(document.getElementById("seats").value);

        if (name == "" || seats <= 0) {
            alert("Enter passenger name and valid seats");
        } else if (seats > 30) {
            alert("Only 30 seats are available.");
        } else {
            booked = true;
            let ticket = "Passenger: " + name +
                "<br>Seats: " + seats +
                "<br>Ticket ID: BUS123";

            document.getElementById("ticket").innerHTML =
                "Ticket booked successfully!";

            document.getElementById("myTicket").innerHTML = ticket;
        }
    }

    function cancelTicket() {
        if (booked) {
            booked = false;
            document.getElementById("myTicket").innerHTML =
                "Ticket cancelled successfully.";
            document.getElementById("ticket").innerHTML = "";
        } else {
            document.getElementById("myTicket").innerHTML =
                "No active ticket.";
        }
    }

    function addComment() {
        let comment = document.getElementById("comment").value;

        if (comment == "") {
            alert("Enter a comment");
        } else {
            document.getElementById("commentResult").innerHTML =
                "Comment submitted: " + comment;
        }
    }

    function adminLogin() {
        let user = document.getElementById("admin").value;
        let pass = document.getElementById("adminPass").value;

        if (user == "admin" && pass == "1234") {
            document.getElementById("report").innerHTML =
                "Admin Login Successful!" +
                "<br>Bus Booking Report Generated.";
        } else {
            document.getElementById("report").innerHTML =
                "Invalid admin details.";
        }
    }
</script>

</body>
</html>
